version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gazeta_postgres
    environment:
      POSTGRES_DB: gazeta
      POSTGRES_USER: gazeta_user
      POSTGRES_PASSWORD: gazeta_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres_data: